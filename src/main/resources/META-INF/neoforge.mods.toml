modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Flatts3000/recompile/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Flatts3000/recompile"
logoFile = "logo.png"
# Pixel art, so no smoothing. The default filters the logo bilinearly and a 50x50 grid comes out
# as a blur, which is the one way to make deliberate pixels look like a low-resolution accident.
logoBlur = false
authors = "${mod_authors}"
description = '''${mod_description}'''

# AFTER, not NONE, and it is load-bearing for data rather than for code.
#
# Mod datapacks are ordered by mod load order, so with NONE this mod's data could lose to NeoForge's -
# and NeoForge ships its own copies of 17 vanilla recipes, retagged to the `#c:` common tags: the bucket
# and all sixteen carpet-dyeing recipes. A file this mod ships at one of those ids is then never read,
# with no error anywhere. That is exactly how the found-only rule (#161) came up seventeen short: the
# overrides for every recipe NeoForge does NOT re-ship worked, and the seventeen it does were silently
# ignored. Corrupting one of the ignored files produced no parse error at all, which is what finally
# gave it away.
#
# Verified by flipping it back: NONE leaves 17 found-only items craftable, AFTER leaves none.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Simple Magnets had a block here (#269) and it left with the four recipe overrides it existed for
# (Flatts3000/trashlands#47, 2026-09-08). The pack ships them now, which is where re-theming another
# mod's recipes belongs; nothing under data/simplemagnets/ remains, so there is no path for load
# order to decide and no dependency to declare. every_cross_mod_override_is_ordered_after_its_mod
# derives the namespaces it wants blocks for from what this mod actually ships, so an entry kept
# here after its files are gone is dead weight rather than a guard.

# AE2 (#268), optional and AFTER, for a LANGUAGE key rather than a recipe.
#
# AE2's JEI info tab for the Inscriber presses says they come from a Mysterious Cube in a meteorite,
# and points at the Meteorite Compass. None of that is true here - meteorites gate on a biome tag this
# mod ships no entry for - so a player reading it is sent after something that cannot exist. This mod
# ships assets/ae2/lang/en_us.json overriding gui.ae2.inWorldCraftingPresses to say where they really
# are.
#
# LANGUAGE FILES MERGE, which is why this needs one key rather than a copy of AE2's whole file: the
# client applies every lang resource for a namespace in ascending priority, so ours only has to be
# LATER, not complete. That is the opposite of a recipe, where only the top file at a path is read.
# Later still means load order, hence AFTER.
#
# TEMPORARY, with the press pool it explains - Flatts3000/trashlands#46.
[[dependencies.${mod_id}]]
modId = "ae2"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Ender IO (#280), optional and AFTER, to DISABLE one of its recipes.
#
# This mod ships a file at enderio:sag_milling/blaze_powder whose condition is never satisfied, which
# replaces Ender IO's recipe with one that does not load. Its version grinds a blaze rod back into
# four powder, and with a grinding ball's output multiplier - up to 1.75 on the vibrant alloy ball -
# that turns this mod's four-powder-to-one-rod Sintering Kiln chain into an automatable gain of up to
# 75 percent per cycle: the exact loop the Blaze Briquette was designed to make impossible.
#
# AFTER is what makes the override win. Only the top file at a path is read and datapacks are ordered
# by mod load order, so without this line Ender IO's file stays on top, ours is never read, and
# nothing anywhere says so.
[[dependencies.${mod_id}]]
modId = "enderio"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
