modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Flatts3000/recompile/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Flatts3000/recompile"
logoFile = "logo.png"
# Pixel art, so no smoothing. The default filters the logo bilinearly and a 50x50 grid comes out
# as a blur, which is the one way to make deliberate pixels look like a low-resolution accident.
logoBlur = false
authors = "${mod_authors}"
description = '''${mod_description}'''

# AFTER, not NONE, and it is load-bearing for data rather than for code.
#
# Mod datapacks are ordered by mod load order, so with NONE this mod's data could lose to NeoForge's -
# and NeoForge ships its own copies of 17 vanilla recipes, retagged to the `#c:` common tags: the bucket
# and all sixteen carpet-dyeing recipes. A file this mod ships at one of those ids is then never read,
# with no error anywhere. That is exactly how the found-only rule (#161) came up seventeen short: the
# overrides for every recipe NeoForge does NOT re-ship worked, and the seventeen it does were silently
# ignored. Corrupting one of the ignored files produced no parse error at all, which is what finally
# gave it away.
#
# Verified by flipping it back: NONE leaves 17 found-only items craftable, AFTER leaves none.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Simple Magnets (#269), optional and AFTER for exactly the reason the neoforge dependency above is.
#
# This mod ships four files at simplemagnets' OWN recipe ids, re-theming its magnets onto Magnet Scrap
# because its stock recipes are built on an ender pearl and lapis, which are placeholders rather than
# recipes in a world about recovering material. An override at another mod's id only wins if this mod's
# datapack is read after theirs, and the loser is silent - the seventeen-recipe incident above is the
# same failure, one dependency line up.
#
# OPTIONAL, so the mod loads normally without Simple Magnets, and the four files carry a
# neoforge:mod_loaded guard so they are inert in that case.
#
# TEMPORARY. This is pack content in the engine because the pack cannot ship data on 26.1.2; it leaves
# when KubeJS is fixed (Flatts3000/trashlands#47), and this dependency block leaves with it.
[[dependencies.${mod_id}]]
modId = "simplemagnets"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
