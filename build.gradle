plugins {
    id 'java'
    // JaCoCo, added by the COVER pass. It instruments the JUnit layer only - see the jacocoTestReport
    // block below for why the GameTests cannot be measured the same way, which matters because they
    // are where most of this mod's behaviour is actually proven.
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.141'
    // CurseForgeGradle: wraps the CurseForge Upload API so `./gradlew publishCurseForge`
    // uploads the built jar. Mirrors the productive-frogs setup.
    id 'net.darkhax.curseforgegradle' version '1.2.30'
}

base {
    // MC version in the artifact name (Mekanism convention) so the jar is
    // unmistakable: recompile-26.1.2-0.1.0-alpha.1.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// The JaCoCo agent, fetched as a plain dependency so a run task can point -javaagent at a real file.
// The plugin's own internal configuration is not addressable from a moddev run block.
configurations {
    jacocoRuntimeAgent
}

/**
 * What no coverage report counts, shared by both so their numbers mean the same thing.
 *
 * <p>Only the gametest package. It is test code that lives under src/main/java because GameTest
 * registration requires it, so counting it would pad the figure with tests testing themselves.
 *
 * <p>client/** is deliberately NOT excluded here even though neither test layer can reach it. Hiding it
 * would make the headline number look better while removing the evidence that 389 lines have no
 * automated coverage at all; docs/test_coverage.md subtracts it explicitly instead, where the
 * subtraction is visible and argued.
 */
ext.COVERAGE_EXCLUDES = [
    'com/flatts/recompile/gametest/**',
]
dependencies {
    jacocoRuntimeAgent "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"
}


neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            // devbridge (its own repo, F:\devbridge): lets tooling drive this client from outside -
            // run commands in a singleplayer world and take screenshots. Inert without this property,
            // and the jar lives in run/mods rather than being a dependency, so it cannot ship.
            //
            // 8605 is CLAIMED for this repo in ~/.claude/port_registry.yaml, deliberately not
            // devbridge's own 25580 default. Every project that keeps the default lands on one socket:
            // Trashlands' quest verifier once connected to THIS client and reported six item ids
            // resolving, a clean pass about the wrong game. Claiming prevents the clash but cannot
            // detect it, because the ports helper enumerates IPv4 only and devbridge binds
            // getLoopbackAddress(), which is ::1 here - so the registry reports the port free while a
            // game holds it. A tool that must be sure asks what answered.
            systemProperty 'devbridge.port', '8605'
            // Boot straight into a world instead of stopping at the title screen. Vanilla's own
            // launch argument, not a mod feature. `--args` on the Gradle task does NOT do this: the
            // moddev run treats it as a main class and the launch dies before Minecraft starts.
            //
            // THE WORLD MUST ALREADY EXIST, AND THE NAME MUST NOT CONTAIN A SPACE (#289). Quick play
            // does not create a missing world - it shows a "Could not find world with the provided
            // identifier" SCREEN, which logs nothing, so the symptom is a client that sits at a menu
            // and a devbridge socket that never opens. And moddev quotes any argument containing a
            // space into build/moddev/clientRunProgramArgs.txt, so 'New World' reached the game as
            // '"New World"', quotes included, matching no directory on disk.
            //
            // `python tools/make_dev_world.py` builds this world with the mod's own generator. Do
            // not let the client create it instead: a world made through the GUI is a vanilla
            // default one that ignores recompile:garbage silently.
            programArguments.addAll '--quickPlaySingleplayer', 'devworld'
            // Force the window size, because a screenshot IS the framebuffer: devbridge captures at
            // whatever the window happens to be, and the default gave 854x480 - unusable next to a
            // gallery of 1300px images. Fixed dimensions also mean every shot crops identically.
            programArguments.addAll '--width', '1920', '--height', '1080'
        }
        server {
            server()
        }
        // moddev 2.0+ split the old `data()` run into clientData()/serverData().
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources').absolutePath,
                                    '--existing', file('src/main/resources').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources').absolutePath,
                                    '--existing', file('src/main/resources').absolutePath
        }
        // Headless server that runs registered GameTests on boot, non-zero exit
        // on failure. Invoke via `./gradlew runGameTestServer`. moddev 2.0.141
        // has no gameTestServer() convenience method, so set the type directly.
        gameTestServer {
            type.set('gameTestServer')
            // COVERAGE FOR THE LAYER THAT ACTUALLY PROVES THIS MOD. GameTests run in their own server
            // JVM, so the `test` task's JaCoCo sees none of them - and reading that report alone says
            // content/block/entity is at 0.7% when in truth nearly every machine in it has in-world
            // tests. Opt in with -PgameTestCoverage so a normal run is not slowed or altered.
            if (project.hasProperty('gameTestCoverage')) {
                // The PROVIDER is handed over unresolved. Calling .get() here would resolve the agent
                // configuration during the configuration phase, so every task in the build - compileJava
                // included - would pay for dependency resolution and fail at configuration time if the
                // artifact were unavailable.
                jvmArguments.add(providers.provider {
                    def agent = configurations.jacocoRuntimeAgent.singleFile
                    def out = project.layout.buildDirectory.get().asFile
                    // JaCoCo separates its own options with commas and equals signs, so a path
                    // containing either is misparsed rather than rejected - it would silently write the
                    // exec file somewhere else and report a coverage number from nothing. Fail loudly
                    // instead; this machine's paths are fine and a CI runner's may not be.
                    [agent.toString(), out.toString()].each { path ->
                        if (path.contains(',')) {
                            throw new GradleException(
                                "JaCoCo cannot take a path containing a comma: ${path}")
                        }
                    }
                    "-javaagent:${agent}=destfile=${out}/jacoco/gameTest.exec," +
                        "append=false,includes=com.flatts.recompile.*"
                })
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // moddev's JUnit integration: tests under src/test/java run against a real,
    // loaded mod context (registries populated, tags resolvable) without booting
    // a full server. Invoke via `./gradlew test`.
    unitTest {
        enable()
        testedMod = mods.named("${mod_id}").get()
    }
}

repositories {
    // JEI (Just Enough Items) - mezz's maven at BlameJared.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // Jade (the WAILA fork) - served via the Modrinth maven.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Modonomicon (the in-game guidebook engine) - klikli-dev's Cloudsmith maven.
    // Scoped to the one group so it never shadows others.
    maven {
        name = 'Cloudsmith klikli-dev'
        url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'
        content { includeGroup 'com.klikli_dev' }
    }
}

dependencies {
    // JEI (recipe/item browser) + Jade (block/entity tooltips). We ship plugins for
    // both (com.flatts.recompile.compat.{jei,jade}), so the APIs are compileOnly - the
    // @JeiPlugin / @WailaPlugin classes need them to compile - while the full mods stay
    // runtimeOnly: present in dev runs (runClient), never a hard dependency, never
    // shipped. The plugin classes only load when the viewer mod is present.
    // Versions mirror the productive-frogs 26.1.2 line.
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.6.2.38"
    runtimeOnly "mezz.jei:jei-26.1.2-neoforge:29.6.2.38"
    // Jade publishes no separate -api artifact; its mod jar bundles snownee.jade.api,
    // so the same coordinate serves compile and runtime.
    compileOnly "maven.modrinth:jade:gWlwZzoj"
    runtimeOnly "maven.modrinth:jade:gWlwZzoj"

    // Pipez - item/fluid/energy pipes, runtimeOnly and dev-only. There is no compile
    // dependency and no plugin: Pipez moves things through NeoForge's own capabilities,
    // so anything this mod exposes is already reachable by it. It is here so a dev run
    // can prove that BOTH directions hold - that the Cupola accepts automation and the
    // Burn Barrel still refuses it, which is the Cupola's whole reason to exist.
    // Standalone: all four of its Modrinth dependencies are optional.
    runtimeOnly "maven.modrinth:pipez:1hVEeHBs"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Modonomicon (the in-game guidebook engine) - client-render-only, added to every run
// EXCEPT the headless gameTestServer. Loaded there, its book-data sync fires on player
// events and throws "sync_book_data may not be sent to the client" (a dedicated test
// server has no client to receive it), which flakily fails player-spawning GameTests.
// runClient still gets it so the book renders; the book is inert datapack data when the
// engine is absent, and the guide recipe is gated `mod_loaded: modonomicon`. runtimeOnly
// only, so it is never bundled in the published jar. { transitive = false } keeps
// Modonomicon's own deps out of our graph.
boolean isGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
if (!isGameTest) {
    dependencies {
        runtimeOnly("com.klikli_dev:modonomicon-26.1.2-neoforge:2.1.0") { transitive = false }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

/**
 * Coverage for the JUnit layer.
 *
 * <p>READ THE NUMBER CAREFULLY. It measures `./gradlew test` only, and this mod proves most of its
 * behaviour in GameTests, which run in a separate server JVM launched by moddev - so a class with
 * thorough in-world coverage and no unit test reports 0% here. The report is a map of what the PURE
 * layer touches, not a verdict on whether a class is tested.
 *
 * <p>Two whole packages are excluded because counting them makes the number meaningless rather than
 * strict: `gametest` is test code that happens to live in src/main (GameTest registration requires
 * it), and `client` never loads on the server the tests run on.
 */
/**
 * THE NUMBER THAT MEANS SOMETHING: both layers at once.
 *
 * <p>Neither half is the truth on its own. `jacocoTestReport` sees only the JUnit tests and reports
 * content/block/entity at under 1%, when almost every machine in that package has thorough in-world
 * coverage. `gameTest.exec` sees only the GameTests and misses the pure logic the unit layer exists
 * for. This merges them.
 *
 * <p>Run it as: {@code ./gradlew test runGameTestServer -PgameTestCoverage coverageReport}
 */
tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Merged coverage across the JUnit layer and the in-world GameTests.'
    dependsOn tasks.named('classes')
    // ORDERING, not just dependency. Gradle does not honour command-line order for tasks with no
    // declared relationship, so `test runGameTestServer coverageReport` could otherwise report before
    // either had written its exec file.
    mustRunAfter tasks.named('test'), tasks.named('runGameTestServer')

    // A GLOB WOULD REPORT LAST WEEK'S RUN AS THIS ONE'S. `append=false` truncates gameTest.exec only
    // when the agent actually attaches, so without -PgameTestCoverage the file simply survives from an
    // earlier instrumented run and gets merged in silently - a stale number that looks exactly like a
    // fresh one, which is the failure this whole PR is written against. Name the files, and require the
    // GameTest half only when it was actually asked for.
    executionData.setFrom(files(
        project.layout.buildDirectory.file('jacoco/test.exec'),
        project.layout.buildDirectory.file('jacoco/gameTest.exec')
    ).filter { it.exists() })
    doFirst {
        File gameTestExec = project.layout.buildDirectory.file('jacoco/gameTest.exec').get().asFile
        if (!project.hasProperty('gameTestCoverage') && gameTestExec.exists()) {
            throw new GradleException(
                "build/jacoco/gameTest.exec is left over from an earlier instrumented run and this "
                    + "one did not produce it. Merging it would report stale GameTest coverage as "
                    + "current. Re-run with -PgameTestCoverage, or delete the file for a JUnit-only "
                    + "report.")
        }
    }
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.files.collect {
        fileTree(dir: it, exclude: COVERAGE_EXCLUDES)
    }))
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        // THE SAME EXCLUSION AS coverageReport, so the two reports are measured over the same classes
        // and the numbers can be compared. They differed - this one also dropped client/** - which
        // meant 389 zero-covered lines were in one denominator and not the other, and any table putting
        // the two side by side was comparing different things.
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: COVERAGE_EXCLUDES)
        }))
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

tasks.processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'neoforge_loader_version_range', neoforge_loader_version_range
    inputs.property 'neoforge_version', neoforge_version

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            neoforge_version: neoforge_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Aggregate prepare task for the interactive moddev runs. `gradle clean` wipes
// build/moddev/*RunVmArgs.txt; IntelliJ's generated run configs reference those
// at launch, so regenerate them after a clean. Invoke: `./gradlew prepareAllRuns`.
tasks.register('prepareAllRuns') {
    group = 'neoforge runs'
    description = 'Regenerate VM args / classpath files for the interactive moddev runs.'
    dependsOn 'prepareClientRun',
              'prepareServerRun',
              'prepareGameTestServerRun'
}

// CurseForge publish task (mirrors productive-frogs).
//
// Invocation: `./gradlew publishCurseForge` (after a successful `build`).
//
// API key sources (first hit wins):
//   1. .env at repo root (CURSEFORGE_API_KEY=...) - preferred, gitignored
//   2. env var CURSEFORGE_API_KEY
//   3. gradle property cfApiToken (e.g. in ~/.gradle/gradle.properties)
//
// Uploads build/libs/<artifact>-<version>.jar with the per-version CHANGELOG
// section as the file changelog. Alpha, MC 26.1.2 / NeoForge / Java 25.

def readDotEnv(File envFile) {
    def map = [:]
    if (!envFile.exists()) return map
    envFile.eachLine { line ->
        def trim = line.trim()
        if (!trim || trim.startsWith('#')) return
        def eq = trim.indexOf('=')
        if (eq <= 0) return
        def k = trim.substring(0, eq).trim()
        def v = trim.substring(eq + 1).trim().replaceAll(/^["']|["']$/, '')
        map[k] = v
    }
    return map
}

def resolveCfApiToken() {
    def envMap = readDotEnv(file("${rootDir}/.env"))
    return envMap['CURSEFORGE_API_KEY'] ?: System.getenv('CURSEFORGE_API_KEY') ?: findProperty('cfApiToken')
}

// Extract the top section of CHANGELOG.md (from `## v<current>` to the next
// `## v` heading or EOF).
def extractChangelogSection(File changelogFile, String version) {
    if (!changelogFile.exists()) return "Release ${version}"
    def text = changelogFile.text
    def startMarker = "## v${version}"
    def startIdx = text.indexOf(startMarker)
    if (startIdx < 0) return "Release ${version}"
    def endIdx = text.indexOf("\n## v", startIdx + startMarker.length())
    if (endIdx < 0) endIdx = text.length()
    return text.substring(startIdx, endIdx).trim()
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Upload the built jar to CurseForge (project 1625740).'
    dependsOn tasks.named('build')

    apiToken = resolveCfApiToken()

    def primary = upload(1625740, tasks.jar.archiveFile)
    primary.releaseType = 'alpha'
    primary.addGameVersion('26.1.2')
    primary.addModLoader('NeoForge')
    primary.addJavaVersion('Java 25')
    // Tag both environments so the file lists as Client + Server (server spawns/
    // economy, client render/JEI/guidebook).
    primary.addEnvironment('Client', 'Server')
    primary.changelog = extractChangelogSection(file("${rootDir}/CHANGELOG.md"), mod_version)
    primary.changelogType = 'markdown'
    primary.displayName = "${mod_name} ${mod_version}"

    doFirst {
        if (!apiToken) {
            throw new GradleException("CURSEFORGE_API_KEY not set. Put it in .env at repo root, set the env var, or add cfApiToken to ~/.gradle/gradle.properties.")
        }
    }
}
