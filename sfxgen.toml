# Recompile's sounds, as numbers.
#
# Every sound this mod ships is SYNTHESISED from the voices below - nothing is recorded,
# sampled, downloaded or generated by a model. Three reasons, in the order they bind:
#
#   1. This repo is MIT, and a mod ships loose .ogg files inside a jar that anyone can
#      unzip. Most AI audio services forbid exactly that redistribution (ElevenLabs'
#      prohibited use policy 9(c) bars distributing sound-effect output "on a standalone
#      basis ... including as isolated files, audio samples ... or other collections of
#      sounds"), so the licence would promise something the assets could not back. Same
#      shape as the Create split already recorded in CLAUDE.md: MIT code, reserved assets.
#   2. A machine loop plays for as long as a button is held, so a seam is a click once a
#      second forever. Synthesis loops by construction; a clip has to be edited and hoped at.
#   3. Every sound this mod needs is a MACHINE. One voice gives a whole family that cannot
#      drift, and a tier ladder is a scalar rather than four more sourcing jobs.
#
# Tool: ../mc-pack-toolkit/sfxgen. Run `python -m sfxgen all` here, listen on the page it
# writes to gen/, then `approve` and `promote`.

mod_id = "recompile"

# ---------------------------------------------------------------------------------------
# Voices
# ---------------------------------------------------------------------------------------

# The mod's machine voice (owner pick, 2026-09-05, from three candidates).
#
# The first draft was rejected as "too high and annoying", and the cause was not the pitch:
# it was a sustained PURE SINE near a kilohertz, which sits in the ear's most sensitive band
# and never decorrelates. A real machine whine is a resonance with width, which is what
# res_width buys. Air leads the mix and the rotor sits behind it, because a vacuum IS moving
# air.
#
# THE GARBAGE VACUUM'S VOICE, and only its. The Scrap Hauler ran on this for a day and sounded
# like the machine that digs rather than the small thing that trundles; it has `cheerful` below.
# Retuning this moves the vacuum's twelve sounds and nothing else.
[voice.heavy]
f0 = 41.0
harmonics = [1.0, 0.55, 0.28]
air_hp = 140.0
air_lp = 1700.0
res_hz = 330.0
res_width = 1.2
res_gain = 0.45
body_mix = 0.28
wobble_hz = 3.0
wobble = 0.06

# ---------------------------------------------------------------------------------------
# The Scrap Hauler (#376)
#
# CUTE, NOT INDUSTRIAL (owner, 2026-09-05: "more cute than robotic. Sorta like wall e but not
# copying it"). The first pass gave it the Garbage Vacuum's `heavy` voice, which made the little
# robot sound like the machine that digs, and those are not the same character at all.
#
# What separates the two is INFLECTION rather than timbre. Machinery is steady: a rotor, moving air,
# a resonance that does not move. A small creature is pitched and it BENDS - rising is a question,
# falling is a sigh, an arc up and back is a cheerful acknowledgement. So the Hauler is built from
# `chirp`, whose whole content is a pitch contour, and the vacuum keeps `heavy`. Two machines, two
# voices, and now they are telling you which is which.
#
# Not copying WALL-E: the obvious way to chase that reference is formant synthesis driven from vowel
# tables, which is how you build one specific fictional robot rather than a robot. This is one warm
# resonance, a little vibrato and a breath of noise, with every sound's character coming from the
# shape of its own contour.
# ---------------------------------------------------------------------------------------

# The Hauler's own voice: small, warm and tonal, where `heavy` is broad and airy. Only its idle uses
# this - the other three are chirps, which carry their own pitch.
[voice.cheerful]
f0 = 196.0
harmonics = [1.0, 0.42, 0.12]
air_hp = 380.0
air_lp = 2100.0
res_hz = 780.0
res_width = 0.85
res_gain = 0.7
body_mix = 1.45
wobble_hz = 2.6
wobble = 0.16

# Working away to itself: a small warm hum with a slow warble, not a motor. Loops seamlessly.
[sound.hauler_idle]
event = "entity.scrap_hauler.idle"
kind = "loop"
voice = "cheerful"
seconds = 1.6
scale = 1.0
power = 0.30
level = 0.5
seed = 23

# Taking a block: a quick blip up and just back down. The little rise is what makes it read as
# pleased with itself rather than as a machine registering an event.
[sound.hauler_pickup]
event = "entity.scrap_hauler.pickup"
kind = "chirp"
seconds = 0.24
points = [[0.0, 470.0], [0.30, 880.0], [1.0, 790.0]]
harmonics = [1.0, 0.30, 0.10]
formant_hz = 1150.0
formant_gain = 0.8
vibrato_hz = 7.5
vibrato_cents = 26.0
breath = 0.05
seed = 31

# Waking up and rolling out: a rising figure that keeps climbing, which is the sound of something
# becoming interested. The latch under it keeps the Depot mechanical - the machine is cute, the
# hatch it comes out of is not.
[sound.hauler_deploy]
event = "entity.scrap_hauler.deploy"
kind = "layered"
seconds = 0.62
[[sound.hauler_deploy.layer]]
kind = "chirp"
gain = 1.0
seconds = 0.62
points = [[0.0, 300.0], [0.28, 520.0], [0.62, 760.0], [1.0, 940.0]]
harmonics = [1.0, 0.34, 0.12]
formant_hz = 1050.0
formant_gain = 0.75
vibrato_hz = 6.0
vibrato_cents = 20.0
breath = 0.05
seed = 37
[[sound.hauler_deploy.layer]]
kind = "impact"
gain = 0.34
seconds = 0.30
modes = [[150.0, 0.11, 1.0], [233.0, 0.08, 0.6], [352.0, 0.05, 0.3]]
noise_ms = 7.0
noise_gain = 0.5
brightness = 0.9
seed = 53

# Coming home: the deploy figure inverted, settling onto a soft latch at the very end. The pair reads
# as one small thing going out and coming back rather than as two unrelated noises.
[sound.hauler_recall]
event = "entity.scrap_hauler.recall"
kind = "layered"
seconds = 0.70
[[sound.hauler_recall.layer]]
kind = "chirp"
gain = 1.0
seconds = 0.56
points = [[0.0, 900.0], [0.40, 660.0], [1.0, 390.0]]
harmonics = [1.0, 0.36, 0.12]
formant_hz = 980.0
formant_gain = 0.75
vibrato_hz = 5.5
vibrato_cents = 24.0
breath = 0.05
seed = 41
[[sound.hauler_recall.layer]]
kind = "impact"
gain = 0.42
align = "end"
seconds = 0.26
modes = [[150.0, 0.14, 1.0], [233.0, 0.10, 0.7], [352.0, 0.06, 0.35]]
noise_ms = 8.0
noise_gain = 0.55
brightness = 0.85
seed = 53

# ---------------------------------------------------------------------------------------
# The Garbage Vacuum (#378)
#
# ship = false: these are designed and auditionable but not promoted, because nothing plays
# them yet. #378 replaces the current one-shot puff every twelve ticks with rev-up, a
# client-side looping sustain, and rev-down; when that lands, these become approve + promote.
#
# The ladder rises by POWER, not by pitch. A better vacuum moves more air, it does not whine
# higher - which also rules out shipping one file set and pitch-shifting it per tier, since
# the game resamples, and resampling upward is precisely the brightening this voice exists to
# avoid. Four tiers by three phases is twelve files, and generating them costs nothing.
# ---------------------------------------------------------------------------------------

[sound.vacuum_copper_rev_up]
event = "item.garbage_vacuum.copper.rev_up"
kind = "ramp"
voice = "heavy"
ship = false
seconds = 0.45
rising = true
lo = 0.25
hi = 1.0
scale = 1.00
power = 0.85

[sound.vacuum_copper_sustain]
event = "item.garbage_vacuum.copper.sustain"
kind = "loop"
voice = "heavy"
ship = false
seconds = 1.4
scale = 1.00
power = 0.85

[sound.vacuum_copper_rev_down]
