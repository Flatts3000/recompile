# ---------------------------------------------------------------------------------------
# The Garbage Vacuum (#378)
#
# ship = false: these are designed and auditionable but not promoted, because nothing plays
# them yet. #378 replaces the current one-shot puff every twelve ticks with rev-up, a
# client-side looping sustain, and rev-down; when that lands, these become approve + promote.
#
# The ladder rises by POWER, not by pitch. A better vacuum moves more air, it does not whine
# higher - which also rules out shipping one file set and pitch-shifting it per tier, since
# the game resamples, and resampling upward is precisely the brightening this voice exists to
# avoid. Four tiers by three phases is twelve files, and generating them costs nothing.
# ---------------------------------------------------------------------------------------

[sound.vacuum_copper_rev_up]
event = "item.garbage_vacuum.copper.rev_up"
kind = "ramp"
voice = "heavy"
ship = false
seconds = 0.45
rising = true
lo = 0.25
hi = 1.0
scale = 1.00
power = 0.85

