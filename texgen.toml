# Reinforced Concrete (#47/#51): the demolition yard's deck and the block that drops rebar. The exposed
# rebar IS the identity - it is what makes it reinforced rather than a grey cube, and it is the visual
# promise of what the block yields. Pale and dusty on purpose: the vanilla gray_concrete placeholder read
# as near-black slabs against the steel, which is why husk floors looked like holes rather than floors.
[surface.reinforced_concrete]
kind = "block"
backend = "ai"
size = 16
# Three variants at four rotations = 12 permutations, the same trick garbage_block uses. A husk floor is
# dozens of these in a grid, which is exactly where a single tile announces itself as a repeat.
variants = 3
# NOTE the anti-border language. An earlier prompt asked for "chipped edges showing" and got exactly
# that: every tile framed in a darker rim, which is invisible on a single block and turns a floor into
# a grid of dark lines. Detail has to be spread evenly across the tile, never concentrated at its edge.
prompt = "a full-bleed Minecraft block texture: the surface of dusty grey reinforced concrete, coarse aggregate and short rusty orange steel rebar rods running through it, detail spread evenly across the entire tile, absolutely NO border, NO frame, NO darker rim or outline at the edges, no visible tile boundary, uniform edge to edge, flat, no perspective, tiles seamlessly"
# Darkened deterministically rather than by re-prompting. Generated it sat at luminance 126 against Stone
# Rubble's 138 and the steel beam's 136 - three materials within 12 points, which is not a separable
# difference at 16px, so concrete simply vanished into the rubble it lies among. 0.75 puts it near 95:
# about 43 below rubble, and still clearly mid-grey rather than the near-black the vanilla placeholder gave.
brightness = 0.75
# A palette for the procedural backend, so a procedural/AI comparison is fair rather than a strawman:
# without one it falls back to a default grey and loses on presentation, not merit. Dark concrete greys
# with two rust tones for the rebar.
[surface.reinforced_concrete.procedural]
style = "rubble"
palette = ["#5f6166", "#6b6d72", "#54565b", "#7a7c81", "#4a4c50", "#8a5a3a", "#a8663c"]

# ---------------------------------------------------------------------------
# Demolition yard - Steel I-Beam + Cutting Torch (#48)
# ---------------------------------------------------------------------------
# Three surfaces, one per PART of the beam, because fasteners belong on the connector and nowhere else.
#
# Create solves this with a single 32x32 UV atlas: every model face carries an explicit uv rect, so the
# gusset samples a patch that has rivets drawn on it and the web samples a patch that does not. We cannot
# do that here - texgen generates whole surfaces per id, and our boxes use auto-UV - so the split lives in
# the texture ids instead. Each one must therefore read correctly at ANY offset, since auto-UV decides which
# band of the texture a given face samples: uniform and tileable, never a sprite sheet.
#
# The web is the ONLY one generated from a prompt. The flange and gusset derive from it with `reference`,
# which edits the web's raw source at high input fidelity instead of generating blind - the same mechanism
# tin_can_open uses on tin_can, and for the same reason. Three independent generations produced three
# different greys (one blue, one warm, one green) that read as three materials bolted together rather than
# one beam. Deriving keeps a single palette by construction, so the parts cannot drift.
#
# Scale drives the prompts. The flange faces are 2px tall and the web 2px wide, so anything busy becomes
# noise once sliced. Only the gusset is a large enough flat area to carry rivet heads.
[surface.steel_beam_web]
kind = "block"
backend = "ai"
size = 16
prompt = "a full-bleed Minecraft block texture: plain grey painted structural steel plate, smooth and unadorned with NO bolts and NO rivets, faint vertical rust streaks and lightly chipped paint, flat, no perspective, uniform across the whole tile, tiles seamlessly"

# Derived: same plate, one step darker so the I-profile reads as flange-web-flange rather than one slab.
# The generation came back far too dark (~37 luminance below the web, and asking for "slightly darker"
# in the prompt produced anything from -38 to -80). brightness pulls it back deterministically to a
# separation you can actually tune, instead of regenerating and hoping.
[surface.steel_beam_flange]
kind = "block"
backend = "ai"
size = 16
reference = "steel_beam_web"
match_hue = "steel_beam_web"
brightness = 1.18
prompt = "keep this exact steel plate, its palette and all its markings unchanged - only darken it slightly and add a little extra surface wear. Add NO bolts, NO rivets and no new features. It must still tile seamlessly and stay uniform across the whole tile"

# Derived: the same plate with the beam's ONLY fasteners added.
[surface.steel_beam_gusset]
kind = "block"
backend = "ai"
size = 16
reference = "steel_beam_web"
match_hue = "steel_beam_web"
prompt = "keep this exact steel plate, its palette and its base colour unchanged, and add a regular evenly spaced grid of round rivet heads on top of it, each rivet catching a highlight with a little rust bleeding beneath it. Change nothing else about the plate. It must still tile seamlessly"

# The offcut is cut FROM the beam, so it must be the same steel. match_hue re-casts the generated icon
# onto the web's colour at promote time, which is cheaper and more reliable than hoping two separate
# generations land on the same grey - they did not, last time we tried.
[surface.steel_offcut]
kind = "item"
backend = "ai"
size = 16
match_hue = "steel_beam_web"
prompt = "a single short offcut of a steel I-beam, one stubby chunk of grey steel at a three-quarter angle, the I-shaped cross-section reading as a bold clear notch on the near cut end, the piece large in frame and filling most of the icon, torch-cut edges, a touch of rust, very few details, chunky readable shapes, simple bold Minecraft item icon silhouette, centered, plain transparent background, no scene"

# Blueprints (#95): knowledge as an item. The sheet has to read as a document at 16px, which is
# why the prompt asks for one strong blue field with a few white lines rather than a drawing -
# any actual technical detail turns to noise at this size.
[surface.blueprint]
kind = "item"
backend = "ai"
size = 16
prompt = "a single folded blueprint sheet held at a slight angle, deep blue paper with a few bold white technical lines and one white circle on it, one corner creased and slightly torn, faded and salvaged, very few details, chunky readable shapes, simple bold Minecraft item icon silhouette, centered, plain transparent background, no scene"

# The Clean Mattress: the same object the Bulky Waste find is, minus the filth. It must read as
# the mattress family - striped ticking, the same fabric the block faces use - or the payoff does
# not connect to the thing it came from.
#
# First prompt rejected 2026-08-02, and both of its mistakes are worth not repeating. It asked for
# the mattress ROLLED and seen END-ON "so the spiral reads clearly"; what came back read as a coil
# of rope or a washer, because a spiral is not a silhouette anyone recognises at 16px. And it asked
# for "pale blue-grey ... clean and fresh", which the model correctly rendered as almost white -
# leaving nothing for the eye at icon size. Flat, angled, high-contrast stripes instead: the
# stripes are the identity, so they have to survive the downsample.
[surface.clean_mattress]
kind = "item"
backend = "ai"
size = 16
prompt = "a single clean mattress lying flat, seen from above at a slight angle, off-white ticking fabric with three bold dark blue vertical pinstripes running across it, a row of four dark round button tufts down the middle, a crisp piped seam around the edge, no stains and no tears, strong contrast, very few details, chunky readable shapes, simple bold Minecraft item icon silhouette, centered, plain transparent background, no scene"

# The Filing Cabinet (#95): a Bulky Waste find that stores blueprints without bound and joins the
# Scrap Network by placement. Office-green on purpose - the dump's palette is browns and greys, so a
# block a player is meant to find and recognise across a base needs a colour nothing else here has.
[surface.filing_cabinet]
kind = "block_multiface"
backend = "ai"
size = 16
faces = ["front", "side", "top"]
[surface.filing_cabinet.prompt]
front = "a full-bleed Minecraft block face: the front of a battered olive-green metal filing cabinet, three stacked horizontal drawer fronts, each with one small pale handle and a little card label holder, chipped paint and rust streaks down the seams, muted, flat, no perspective, fills the whole tile"
side = "a full-bleed Minecraft block face: the plain side panel of a battered olive-green metal filing cabinet, one faint vertical seam near the front edge, chipped paint and rust streaks, muted, flat, no perspective, fills the whole tile"
top = "a full-bleed top-down Minecraft block face: the top of a battered olive-green metal filing cabinet, flat sheet metal with a raised rim, a few loose yellowed paper scraps and dust, chipped paint and rust, muted, flat, no perspective, fills the whole tile"

# The Idea Fragment (#95). It is deliberately NOT a piece of the blueprint, and that is a reversal.
#
# It was first declared with reference = "blueprint" so the two would read as one document torn in
# half. The owner rejected that on the art and gave the better reason (2026-08-02): a fragment is an
# arbitrary idea, not an item. The blueprint is the finished artifact; the fragment is the half-formed
# thought that precedes it, so it should look like nothing in particular. Colourless is the point -
# next to the blue sheet it reads as "not yet a document" rather than "half a document".
#
# The shipped PNG was generated from the blueprint before that call, so a regeneration WILL come back
# different. Promote re-finalises from art_src with no API call, so the shipped art is safe; only a
# fresh generate would change it.
[surface.idea_fragment]
kind = "item"
backend = "ai"
size = 16
prompt = "a small pale scrap of an idea, a torn shred of blank off-white paper with a few faint scribbled pencil marks on it, no colour and no printing, ragged tear edges, small in frame, very few details, chunky readable shapes, simple bold Minecraft item icon silhouette, centered, plain transparent background, no scene"

[surface.cutting_torch]
kind = "item"
backend = "ai"
size = 16
prompt = "an oxy-acetylene cutting torch: a metal handle with a curved brass nozzle tipped by a small blue flame, two hose valves, simple bold Minecraft item icon silhouette, centered, plain transparent background, no scene"

# ---------------------------------------------------------------------------------------------------
# Recovered paintings (#99). Real works, pixelated to Minecraft resolution, found in the trash.
#
# These are NOT generated. Each is a public-domain artwork downscaled from a museum/Wikimedia PD-Art
# source, and `source` below records which file, so provenance is auditable rather than remembered.
#
# THE RULE FOR ADDING A SEVENTH, because this is where someone will look:
#   - Public domain in the US *and* the EU. The terms differ and a work can be clear in one and
#     protected in the other; a mod is distributed globally. Artists who died before 1945 are safe.
#   - The artwork being PD is not the whole question - a PHOTOGRAPH of it can carry its own copyright
#     in some jurisdictions. Take it from a museum open-access programme or Wikimedia PD-Art.
#   - Record the source file here. An unsourced painting cannot be defended later.
#
# kind = "painting" writes to textures/painting/ and marks the surface as an atlas: 16px per BLOCK and
# rarely square, so promote must never resize it. A squashed Mona Lisa still looks like a Mona Lisa,
# which is exactly why nothing would catch it.

[surface.painting_great_wave]
kind = "painting"
backend = "ai"          # never generated; candidates are placed by hand from the source image
size = 48
blocks = "3x2"
source = "wikimedia:Tsunami by hokusai 19th century.jpg"
prompt = "The Great Wave off Kanagawa by Hokusai, downscaled to 48x32"

[surface.painting_starry_night]
kind = "painting"
backend = "ai"          # never generated; candidates are placed by hand from the source image
size = 64
blocks = "4x3"
source = "wikimedia:Van Gogh - Starry Night - Google Art Project.jpg"
prompt = "The Starry Night by van Gogh, downscaled to 64x48"

[surface.painting_the_scream]
kind = "painting"
backend = "ai"          # never generated; candidates are placed by hand from the source image
size = 48
blocks = "3x4"
source = "wikimedia:Edvard Munch, 1893, The Scream ... National Gallery of Norway.jpg"
prompt = "The Scream by Munch, downscaled to 48x64"

[surface.painting_mona_lisa]
kind = "painting"
backend = "ai"          # never generated; candidates are placed by hand from the source image
size = 32
blocks = "2x3"
source = "wikimedia:Mona Lisa, by Leonardo da Vinci, from C2RMF retouched.jpg"
prompt = "Mona Lisa by Leonardo, downscaled to 32x48"

[surface.painting_pearl_earring]
kind = "painting"
backend = "ai"          # never generated; candidates are placed by hand from the source image
size = 48
blocks = "3x4"
source = "wikimedia:Meisje met de parel.jpg"
prompt = "Girl with a Pearl Earring by Vermeer, downscaled to 48x64"

[surface.painting_la_grande_jatte]
kind = "painting"
backend = "ai"          # never generated; candidates are placed by hand from the source image
size = 48
blocks = "3x2"
source = "wikimedia:A Sunday on La Grande Jatte, Georges Seurat, 1884.jpg"
prompt = "A Sunday Afternoon on the Island of La Grande Jatte by Georges Seurat, downscaled to 48x32"

# The Hydroponics Bay (#43): the machine that grows what this world cannot otherwise reach.
#
# Three faces because the top has a lit variant - grow-lights on while a batch runs, the same beat as
# the Tree Nursery glowing and the Burn Barrel's fire. Prompts name ONE dominant shape and a colour
# anchor each, the lesson from the Burner Generator's first rejected set: grey plus small detail
# resolves to noise at 16px, and every face averaged into the same square.
[surface.hydroponics_bay_top]
kind = "block"
backend = "ai"
size = 16
prompt = "top-down view of a shallow metal tray of green seedlings growing in water, bright green shoots in neat rows on dark water, bold simple Minecraft block texture, flat lighting, seamless tile"

[surface.hydroponics_bay_top_lit]
kind = "block"
backend = "ai"
size = 16
reference = "hydroponics_bay_top"
prompt = "the same tray of seedlings under bright magenta-pink grow lights, the water and leaves washed in vivid pink-purple light, clearly glowing, bold simple Minecraft block texture, seamless tile"

# The Broken Hydroponics Bay (#95): the Bulky Waste find that teaches the working one.
#
# Derived from the working tray through reference rather than prompted blind, because it has to read
# as THE SAME MACHINE wrecked - a separately-prompted broken tray comes back as a different object and
# the player never connects the find to the thing they are trying to build. Only the top is new: the
# side reuses hydroponics_bay_side and the bottom reuses tree_nursery_bottom, so one API call covers it.
[surface.broken_hydroponics_bay_top]
kind = "block"
backend = "ai"
size = 16
reference = "hydroponics_bay_top"
prompt = "keep this exact tray unchanged - same frame, same layout, same materials and colours. Change only its condition: it is now wrecked and dead. The growing channels are cracked and empty with no plants and no glow, the surface is dry and dulled with grime and rust streaks, one corner of the frame is bent and split open. Muted, flat, no perspective, fills the whole tile"

[surface.hydroponics_bay_side]
kind = "block"
backend = "ai"
size = 16
prompt = "side of a white enamelled machine cabinet with a single wide dark window showing water inside, one clean horizontal band, no text, bold simple Minecraft block texture, flat lighting, seamless tile"

